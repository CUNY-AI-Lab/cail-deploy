name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run complete acceptance gate
        run: bun run check
      - name: Build Worker
        run: bun run build

# What this does and does not cover.
#
# CI runs the repository's complete self-contained acceptance gate: fixture and
# package authorities, format/lint/types, Bun tests, local Worker
# Loader/Workflow/WfP lifecycle, OAuth/MCP, and a Wrangler dry build. Fleet-wide
# source-head and composed-system authority remains kale-integration's job.
