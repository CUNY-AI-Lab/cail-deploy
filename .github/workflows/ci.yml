name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun test test/*.test.ts

# What this does and does not cover.
#
# CI verifies code correctness: types, tests, and that the worker builds. It
# deliberately does not run the cross-repository source-pin checks, which need
# the sibling constellation a runner does not have. Those are the release gate's
# job — kale-integration validates them with every component checked out, and
# executes each consumer's own guard there.
